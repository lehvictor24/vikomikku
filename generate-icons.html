<!DOCTYPE html>
<!-- Open this file once in a browser to generate icon-192.png and icon-512.png -->
<html><body>
<canvas id="c"></canvas>
<script>
const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#0d1117"/>
  <rect x="40" y="40" width="432" height="432" rx="72" fill="#141b27"/>
  <rect x="120" y="80" width="36" height="352" rx="8" fill="#1e2d42"/>
  <rect x="156" y="96" width="236" height="320" rx="6" fill="#0a0f1a"/>
  <rect x="156" y="96" width="236" height="320" rx="6" fill="none" stroke="#1e2d42" stroke-width="2"/>
  <text x="256" y="305" text-anchor="middle" font-family="serif" font-size="168" font-weight="700" fill="#4f8ef7" opacity="0.9">墨</text>
  <rect x="176" y="420" width="160" height="4" rx="2" fill="#4f8ef7" opacity="0.5"/>
</svg>`;

const blob = new Blob([svg], {type:'image/svg+xml'});
const url  = URL.createObjectURL(blob);
const img  = new Image();
img.onload = () => {
  [192, 512].forEach(size => {
    const c = document.getElementById('c');
    c.width = c.height = size;
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0, size, size);
    const a = document.createElement('a');
    a.href = c.toDataURL('image/png');
    a.download = `icon-${size}.png`;
    a.textContent = `Download icon-${size}.png`;
    a.style = 'display:block;margin:8px;font-family:sans-serif;font-size:16px';
    document.body.appendChild(a);
    a.click();
  });
  URL.revokeObjectURL(url);
};
img.src = url;
</script>
</body></html>
